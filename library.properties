sentence=Xahau client for Arduino/ESP32: dual-curve signing, NetworkID, Hooks/URIToken/Oracle, RPC, optional WebSocket.
paragraph=Portable Xahau binary codec and signing (Ed25519 + secp256k1), field-bag serialization for Payments through OracleSet/Invoke/SetHook/URIToken/Remit, JSON-RPC builders/parsers, Mock and optional ESP32 Ws transport. Aligned to live mainnet type codes (NetworkID 21337).
