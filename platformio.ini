; XahauClient — development & test environments
; Host tests:  set PATH to include mingw64\bin, then: pio test -e native

[platformio]
default_envs = native
src_dir = src
test_dir = test/native

[env]
lib_ldf_mode = chain+
build_flags =
  -DXAHAU_FEATURE_ED25519=1
  -DXAHAU_FEATURE_SECP256K1=1
  -DXAHAU_FEATURE_NET=0
  -DXAHAU_FEATURE_DEBUG=0
  -I src
  -I src/xahau/crypto/vendor

; ---------------------------------------------------------------------------
; Native host unit tests (no device upload)
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  ${env.build_flags}
  -DXAHAU_PLATFORM_HOST=1
  -std=c++17
  -Wall
  -Wextra
  -I src
  -I src/host_shims
  -I src/xahau/crypto/vendor
  -Wno-unused-parameter
  -Wno-type-limits
test_build_src = true
test_framework = unity

; ---------------------------------------------------------------------------
; Optional on-device smoke (needs board for upload)
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
  ${env.build_flags}
  -DXAHAU_PLATFORM_ARDUINO=1
  -DXAHAU_FEATURE_NET=1
  -I src/xahau/crypto/vendor
lib_deps =
  links2004/WebSockets
test_build_src = true
test_framework = unity
